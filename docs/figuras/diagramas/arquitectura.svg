<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arquitectura-title arquitectura-desc" id="arquitectura-root">
<title id="arquitectura-title">Arquitectura de despliegue de SprintScrum</title>
<desc id="arquitectura-desc">Diagrama de despliegue: el navegador llega por HTTPS a Traefik v3 en el VPS de iAgentek (Docker Swarm, un nodo), que enruta al portal web nginx y a la API FastAPI; la API encola trabajos en Redis 7 para el worker Celery, y ambos escriben en PostgreSQL 15 de Supabase maestría con RLS.</desc>
