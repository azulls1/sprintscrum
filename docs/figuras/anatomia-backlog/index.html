d" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Tarjetas: historias de usuario, alto = puntos (2.6 unidades por punto)</span><span class="iso-key"><svg class="iso-swatch" viewBox="0 0 16 10" aria-hidden="true"><path class="bl-warn-line" d="M1.5 5h13"/></svg>Gálibo y zona ámbar: más de 8 puntos o más de 16 en el sprint</span><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Aguja: puntos en la caja frente a la capacidad (16)</span></span><span class="sc-equipo bl-carriles" data-part="carriles" aria-live="off"></span><span class="bl-historia" data-part="historia" aria-live="polite"></span><span class="iso-caption">El product backlog de AgendaFácil como clasificadora de tarjetas. Las 8 historias llegan revueltas a la tolva. El puente lector las reparte por prioridad en tres carriles: Alta (lo que permite reservar una cita), Media y Baja. Al estimar, cada tarjeta crece hasta sus puntos en la serie de Fibonacci (regla del fondo: 1, 2, 3, 5, 8, 13); suman 50. La caja del Sprint 1 está sobre una báscula: la compuerta deja pasar las historias de mayor prioridad mientras quepan en la capacidad de una semana, 16 puntos, y entran HU-01, HU-02 y HU-03 (3 + 5 + 8 = 16). Las demás siguen en el backlog. HU-08 (13 puntos) rebasa el gálibo del pórtico, puesto en la mitad de la capacidad (8 puntos): por sí sola se comería el 81 % del sprint, así que habría que dividirla antes de planearla.</span></figcaption></figure>
